<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lifenome IP — Scientific Due Diligence</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0a0e1a;--ink2:#2c3550;--ink3:#5a6a8a;--ink4:#94a4c4;
  --paper:#fff;--sheet:#f4f7fb;--sheet2:#eef3f9;--border:#dde6f0;--border2:#c7d6e8;
  --blue:#1452d4;--blue-lt:#e8effe;
  /* evidence-tier strength scale */
  --ev-vitalage:#0f9b8e;--ev-vitalage-bg:#e3f6f3;
  --ev-methyl:#1aa6a6;--ev-methyl-bg:#e2f5f5;
  --ev-wgs:#1452d4;--ev-wgs-bg:#e8effe;
  --ev-poly:#3a6fe0;--ev-poly-bg:#eaf0fd;
  --ev-exome:#6b4bd6;--ev-exome-bg:#efeafb;
  --ev-composite:#c98a17;--ev-composite-bg:#fbf2dd;
  --ev-rec:#7a879f;--ev-rec-bg:#eef1f6;
  --s1:0 1px 3px rgba(10,14,26,.06);--s2:0 4px 20px rgba(10,14,26,.10);
  --r:11px;
}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sheet);color:var(--ink);font-size:14px;line-height:1.5}
.mono{font-family:'DM Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:248px 1fr;height:100vh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.side-top{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}
.brand-txt b{font-family:'Sora';font-weight:700;font-size:14px;display:block;letter-spacing:.2px}
.brand-txt span{font-size:11px;color:#9fb0d4}
.side-sub{font-size:11px;color:#8294ba;margin-top:14px;line-height:1.5}
.nav{padding:14px 12px;flex:1;overflow-y:auto}
.nav-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6f80a6;margin:14px 10px 7px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:8px;color:#c6d2ea;font-size:13.5px;font-weight:500;text-align:left;transition:.13s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--blue);color:#fff}
.nav-item .ic{width:18px;text-align:center;font-size:13px;opacity:.9}
.nav-item .ct{margin-left:auto;font-size:11px;color:#7e8fb6;font-family:'DM Mono'}
.nav-item.on .ct{color:#cdd9f5}
.side-foot{padding:13px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#6f80a6;line-height:1.5}

.main{overflow-y:auto;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding:13px 30px;display:flex;align-items:center;gap:16px}
.crumb{font-size:12.5px;color:var(--ink3)}
.crumb b{color:var(--ink);font-weight:600}
.srch{margin-left:auto;position:relative;width:340px;max-width:42vw}
.srch input{width:100%;padding:9px 32px 9px 13px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;background:#fff;outline:none;transition:.15s}
.srch input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,82,212,.1)}
.srch .x{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--ink4);font-size:16px;display:none}
.srch.has .x{display:block}
.wrap{padding:28px 30px 60px;max-width:1180px}

/* ── headings ── */
.h-eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:7px}
.h-title{font-family:'Sora';font-size:25px;font-weight:700;letter-spacing:-.4px;margin-bottom:5px}
.h-sub{color:var(--ink3);font-size:13.5px;max-width:680px;margin-bottom:22px}

/* ── modality stack (hero) ── */
.stack{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.grp-lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);font-weight:600;margin:14px 2px 3px}
.grp-lbl:first-child{margin-top:0}
.mrow{display:grid;grid-template-columns:142px 1fr auto;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--border);
  border-radius:10px;padding:11px 15px;transition:.13s;cursor:pointer;text-align:left;width:100%}
.mrow:hover{border-color:var(--border2);box-shadow:var(--s1);transform:translateX(2px)}
.mrow.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,82,212,.12)}
.mrow .mname{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
.mdot{width:9px;height:9px;border-radius:3px;flex:none}
.mrow .mbar{height:7px;background:var(--sheet2);border-radius:4px;overflow:hidden}
.mrow .mbar i{display:block;height:100%;border-radius:4px}
.mrow .mct{font-family:'DM Mono';font-size:13px;color:var(--ink2);font-weight:500;min-width:48px;text-align:right}
.mrow .mct span{color:var(--ink4);font-size:11px}

/* ── filter bar ── */
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 16px;padding-top:18px;border-top:1px solid var(--border)}
.fbar .lbl{font-size:12px;color:var(--ink3);font-weight:600}
.chip{padding:5px 11px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;color:var(--ink2);font-weight:500;transition:.12s}
.chip:hover{border-color:var(--border2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.spacer{margin-left:auto;font-size:12px;color:var(--ink3);font-family:'DM Mono'}

/* ── insight cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
.card{background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:15px 16px 14px;cursor:pointer;transition:.13s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2);box-shadow:var(--s2);transform:translateY(-2px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--border2))}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.card-name{font-family:'Sora';font-weight:600;font-size:14px;line-height:1.3;flex:1}
.card-desc{font-size:12.5px;color:var(--ink3);line-height:1.5;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.ev-badge .d{width:6px;height:6px;border-radius:50%}
.tag{font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--sheet2);color:var(--ink3);font-weight:500}
.tag.mod{font-family:'DM Mono';background:var(--blue-lt);color:var(--blue)}
.comp-flag{font-size:10.5px;color:var(--ev-composite);font-weight:600}

/* ── program grid ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{border-radius:13px;overflow:hidden;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:.14s}
.pcard:hover{box-shadow:var(--s2);transform:translateY(-3px)}
.pcard .ph{height:84px;background-size:cover;background-position:center;position:relative}
.pcard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
.pcard .pb{padding:13px 15px 15px}
.pcard .pn{font-family:'Sora';font-weight:700;font-size:15px}
.pcard .psub{font-size:11.5px;color:var(--ink4);margin-bottom:8px}
.pcard .pd{font-size:12px;color:var(--ink3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.pcard .pstats{display:flex;gap:14px;font-family:'DM Mono';font-size:12px}
.pcard .pstats b{color:var(--ink);font-weight:500}.pcard .pstats span{color:var(--ink4);font-size:10.5px;display:block}

/* ── exome panels ── */
.exome-cat{margin-bottom:8px;border:1.5px solid var(--border);border-radius:11px;background:#fff;overflow:hidden}
.exome-cat-h{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;font-weight:600;font-size:14px}
.exome-cat-h .ct{margin-left:auto;font-family:'DM Mono';font-size:12px;color:var(--ink4)}
.exome-cat-h .car{transition:.2s;color:var(--ink4)}
.exome-cat.open .car{transform:rotate(90deg)}
.exome-panels{display:none;padding:4px 16px 14px;flex-wrap:wrap;gap:7px}
.exome-cat.open .exome-panels{display:flex}
.pan-chip{padding:6px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;color:var(--ink2);background:var(--sheet);transition:.12s}
.pan-chip:hover{border-color:var(--ev-exome);color:var(--ev-exome)}
.pan-chip b{font-family:'DM Mono';color:var(--ink4);font-weight:500;font-size:11px;margin-left:5px}

/* ── tech cards ── */
.tcard{background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:20px 22px;margin-bottom:14px}
.tcard h3{font-family:'Sora';font-size:17px;font-weight:700;margin-bottom:3px}
.tcard .tt{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:11px}
.tcard .claim{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-bottom:15px}
.tsec{margin-bottom:13px}
.tsec .sh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);font-weight:600;margin-bottom:6px}
.tsec ul{list-style:none}.tsec li{font-size:12.5px;color:var(--ink2);line-height:1.55;padding-left:15px;position:relative;margin-bottom:3px}
.tsec li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--border2)}
.metric-row{display:flex;gap:8px;flex-wrap:wrap}
.metric{background:var(--sheet);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:120px}
.metric .mv{font-family:'DM Mono';font-size:14px;font-weight:500;color:var(--ink)}
.metric .ml{font-size:10.5px;color:var(--ink4)}
.caveats{background:#fdf6e8;border:1px solid #f0dcae;border-radius:9px;padding:11px 14px}
.caveats .sh{color:#a06f12}
.caveats li::before{background:#d6a23a}
.caveats li{color:#7d5a16}

/* ── drilldown ── */
.ov{position:fixed;inset:0;background:rgba(10,14,26,.5);backdrop-filter:blur(3px);z-index:100;display:none;justify-content:flex-end}
.ov.show{display:flex}
.panel{width:min(640px,94vw);height:100%;background:var(--sheet);overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.2);animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:.6}to{transform:translateX(0);opacity:1}}
.p-hd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:20px 26px 17px;z-index:2}
.p-close{position:absolute;top:16px;right:20px;width:30px;height:30px;border-radius:8px;background:var(--sheet);color:var(--ink3);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.12s}
.p-close:hover{background:var(--sheet2);color:var(--ink)}
.p-name{font-family:'Sora';font-size:20px;font-weight:700;line-height:1.25;margin:0 36px 9px 0;letter-spacing:-.3px}
.p-hd-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.lens-tog{display:inline-flex;background:var(--sheet);border:1.5px solid var(--border);border-radius:9px;padding:3px;margin-left:auto}
.lens-tog button{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink3);transition:.12s}
.lens-tog button.on{background:#fff;color:var(--ink);box-shadow:var(--s1)}
.p-body{padding:22px 26px 50px}
.blk{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:17px 19px;margin-bottom:13px}
.blk-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink4);font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--ink4);font-weight:500}.kv dd{color:var(--ink2)}
.formula{font-family:'DM Mono';font-size:12px;background:var(--ink);color:#d4e0fb;padding:14px 16px;border-radius:9px;line-height:1.65;white-space:pre-wrap;overflow-x:auto}
.mk-chips{display:flex;gap:6px;flex-wrap:wrap}
.mk{padding:5px 11px;background:var(--blue-lt);color:var(--blue);border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;transition:.12s;border:1.5px solid transparent}
.mk:hover{border-color:var(--blue)}
.ev-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.ev-strength{display:flex;gap:3px}.ev-strength i{width:18px;height:5px;border-radius:3px;background:var(--border2)}
.tech-link{font-size:12.5px;font-weight:600;cursor:pointer}
.lens-clinical,.lens-defense{display:none}
.panel[data-lens="clinical"] .lens-clinical{display:block}
.panel[data-lens="defense"] .lens-defense{display:block}

/* states */
.empty{text-align:center;padding:70px 20px;color:var(--ink3)}
.empty .big{font-family:'Sora';font-size:17px;color:var(--ink2);margin-bottom:6px}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:13px;padding:30px}
.spin{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.inline-load{font-size:12px;color:var(--blue);display:inline-flex;align-items:center;gap:7px;padding:4px 0}
.err{background:#fdecea;border:1px solid #f5c2bd;color:#a8352a;padding:16px 20px;border-radius:11px;font-size:13px;line-height:1.6}
.err b{display:block;margin-bottom:4px;font-family:'Sora'}
.err code{font-family:'DM Mono';background:#fff;padding:1px 6px;border-radius:4px;font-size:12px}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.srch{width:auto;flex:1}.wrap{padding:20px 16px 50px}}
</style>
</head>

  }catch(e){
    document.getElementById('view').innerHTML=
     `<div class="err"><b>Data files not found</b>This app reads its catalog from JSON files in the same folder. Place <code>catalog_core.json</code>, <code>catalog_exome.json</code>, <code>biomarkers_index.json</code>, <code>validation.json</code>, <code>programs_meta.json</code> and <code>exome_panels.json</code> next to this file, then serve the folder (e.g. <code>python -m http.server</code>) and reload.<br><br>Error: ${e.message}</div>`;
  }
}
async function ensureExome(){
  if(S.exomeLoaded)return true;
  if(S.exomeLoading)return S.exomeLoading;
  S.exomeLoading=fetch('catalog_exome.json').then(r=>r.json()).then(d=>{
    S.exome=d.insights; S.exome.forEach(i=>S.insMap.set(i.name.toLowerCase(),i));
    S.exomeLoaded=true; return true;
  });
  return S.exomeLoading;
}

/* ───────── nav ───────── */
const NAV=[
  {id:"layers",ic:"▤",lbl:"Layer Explorer"},
  {id:"biomarkers",ic:"◇",lbl:"Biomarker Query"},
  {id:"programs",ic:"❑",lbl:"Programs"},
  {id:"exome",ic:"⬡",lbl:"Exome Panels"},
  {id:"tech",ic:"✓",lbl:"Technologies"}
];
function renderNav(){
  const counts={layers:S.core.length+"+", biomarkers:S.bm.length, programs:S.progs.length,
    exome:"3,098", tech:S.val.technologies.length};
  document.getElementById('nav').innerHTML='<div class="nav-lbl">Explore</div>'+
    NAV.map(n=>`<button class="nav-item${S.view===n.id?' on':''}" onclick="route('${n.id}')">
      <span class="ic">${n.ic}</span>${n.lbl}<span class="ct">${counts[n.id]||''}</span></button>`).join('');
}
function route(v){S.view=v;S.mod=null;S.prog=null;renderNav();render();window.scrollTo(0,0)}

/* ───────── helpers ───────── */
function evBadge(i){const t=TIERS[i.evidence.tier]||TIERS.composite_literature;
  return `<span class="ev-badge" style="background:${cssv(t.bg)};color:${cssv(t.c)}"><span class="d" style="background:${cssv(t.c)}"></span>${t.lbl}</span>`}
function tierColor(i){return cssv((TIERS[i.evidence.tier]||TIERS.composite_literature).c)}
function modTag(i){const m=MODS[i.src]||{lbl:i.src};return `<span class="tag mod">${m.lbl}</span>`}
function insCard(i){
  return `<div class="card" style="--bar:${tierColor(i)}" onclick="openIns('${esc(i.name)}')">
    <div class="card-top"><div class="card-name">${i.name}</div></div>
    <div class="card-desc">${i.desc||'—'}</div>
    <div class="card-meta">${evBadge(i)}${modTag(i)}${i.competitor?`<span class="comp-flag">vs ${i.competitor}</span>`:''}</div>
  </div>`}
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function crumb(parts){document.getElementById('crumb').innerHTML=parts.map((p,k)=>k===parts.length-1?`<b>${p}</b>`:p).join(' › ')}

/* ───────── render dispatch ───────── */
function render(){
  const v=document.getElementById('view');
  if(S.q){return renderSearch(v)}
  if(S.view==='layers')renderLayers(v);
  else if(S.view==='biomarkers')renderBiomarkers(v);
  else if(S.view==='programs')renderPrograms(v);
  else if(S.view==='exome')renderExome(v);
  else if(S.view==='tech')renderTech(v);
}

/* ── Layer Explorer ── */
function renderLayers(v){
  crumb(['Layer Explorer', S.mod?MODS[S.mod].lbl:'All modalities']);
  const counts={}; allInsights().forEach(i=>counts[i.src]=(counts[i.src]||0)+1);
  counts.dna_exome=counts.dna_exome||3098;
  const max=Math.max(...Object.values(counts));
  let stack='';
  GRP_ORDER.forEach(g=>{
    const rows=Object.keys(MODS).filter(m=>MODS[m].grp===g&&counts[m]);
    if(!rows.length)return;
    stack+=`<div class="grp-lbl">${g}</div>`;
    rows.sort((a,b)=>counts[b]-counts[a]).forEach(m=>{
      const c=counts[m],pct=Math.max(3,c/max*100);
      stack+=`<button class="mrow${S.mod===m?' on':''}" onclick="selMod('${m}')">
        <div class="mname"><span class="mdot" style="background:${MODS[m].c}"></span>${MODS[m].lbl}</div>
        <div class="mbar"><i style="width:${pct}%;background:${MODS[m].c}"></i></div>
        <div class="mct">${c.toLocaleString()}<span> insights</span></div></button>`;
    });
  });
  let list='';
  if(S.mod){
    const items=allInsights().filter(i=>i.src===S.mod);
    list=`<div class="fbar"><span class="lbl">${MODS[S.mod].lbl}</span>
      <button class="chip" onclick="selMod(null)">← all modalities</button>
      <span class="spacer">${items.length.toLocaleString()} insights</span></div>
      <div class="cards">${items.slice(0,300).map(insCard).join('')}</div>
      ${items.length>300?`<div class="empty" style="padding:24px">Showing first 300 of ${items.length.toLocaleString()}. Use search to narrow.</div>`:''}`;
  }
  v.innerHTML=`<div class="h-eyebrow">Data modality → insight → biomarker</div>
    <div class="h-title">The assessment stack</div>
    <div class="h-sub">Every Lifenome insight, organized by the data modality that produces it. Bar width = number of insights. Select a layer to drill in; each insight carries its evidence tier.</div>
    <div class="stack">${stack}</div>${list}`;
}
async function selMod(m){
  if(m==='dna_exome'&&!S.exomeLoaded){
    document.getElementById('view').insertAdjacentHTML('beforeend','<div class="loading" id="ldx"><span class="spin"></span>Loading exome library (3,098 insights)…</div>');
    await ensureExome();
  }
  S.mod=m;render()
}

/* ── Biomarker Query ── */
function renderBiomarkers(v){
  crumb(['Biomarker Query']);
  v.innerHTML=`<div class="h-eyebrow">${S.bm.length.toLocaleString()} biomarkers across the catalog</div>
    <div class="h-title">Biomarker query</div>
    <div class="h-sub">Search any of the ${S.bm.length.toLocaleString()} biomarkers to see which insights and programs consume it, and through which data modalities. Type in the search bar above, or browse the most-referenced below.</div>
    <div class="cards" id="bmcards">${S.bm.slice(0,60).map(bmCard).join('')}</div>`;
}
function bmCard(b){
  const mods=b.srcs.map(s=>MODS[s]?MODS[s].lbl:s).slice(0,3).join(', ');
  return `<div class="card" onclick="openBm('${esc(b.biomarker)}')">
    <div class="card-top"><div class="card-name">${b.biomarker}</div></div>
    <div class="card-meta"><span class="tag mono">${b.insight_count} insight${b.insight_count!=1?'s':''}</span>
      <span class="tag">${mods||'—'}</span></div></div>`;
}

/* ── Programs ── */
function renderPrograms(v){
  crumb(['Programs', S.prog?S.progs.find(p=>p.id===S.prog).name:'']);
  if(S.prog){
    const p=S.progs.find(x=>x.id===S.prog);
    const items=allInsights().filter(i=>i.programs.includes(S.prog));
    v.innerHTML=`<div class="h-eyebrow" style="color:${p.color}">${p.sub||''}</div>
      <div class="h-title">${p.name}</div><div class="h-sub">${p.desc||''}</div>
      <div class="fbar"><button class="chip" onclick="S.prog=null;render()">← all programs</button>
      <span class="spacer">${items.length.toLocaleString()} insights loaded${p.insight_count>items.length?` of ${p.insight_count.toLocaleString()} (load exome to see all)`:''}</span></div>
      <div class="cards">${items.slice(0,300).map(insCard).join('')}</div>`;
    if(p.insight_count>items.length){ensureExome().then(()=>{if(S.prog===p.id)render()})}
    return;
  }
  v.innerHTML=`<div class="h-eyebrow">14 precision-health programs</div>
    <div class="h-title">Programs</div><div class="h-sub">Each program bundles insights across modalities for a clinical or wellness vertical. Counts reflect the full catalog.</div>
    <div class="pgrid">${S.progs.map(p=>`
      <div class="pcard" onclick="openProg('${p.id}')">
        <div class="ph" style="background-image:url('${p.img}')"></div>
        <div class="pb"><div class="pn">${p.name}</div><div class="psub">${p.sub||''}</div>
        <div class="pd">${p.desc||''}</div>
        <div class="pstats"><div><b>${(p.insight_count||0).toLocaleString()}</b><span>insights</span></div>
        <div><b>${(p.marker_count||0).toLocaleString()}</b><span>markers</span></div></div></div>
      </div>`).join('')}</div>`;
}
function openProg(id){S.prog=id;render();window.scrollTo(0,0)}

/* ── Exome Panels ── */
async function renderExome(v){
  crumb(['Exome Panels']);
  v.innerHTML=`<div class="h-eyebrow">Whole-exome clinical reporting · ACMG-tiered</div>
    <div class="h-title">Exome panels</div>
    <div class="h-sub">3,096 traits across 132 curated panels in 14 medical domains, sourced from ClinGen, CGD, DECIPHER/DDG2P, ClinVar and HGMD. This breadth is the core of the genomic-coverage claim. Pipeline stages flagged "in development" are noted in each trait's evidence.</div>`;
  const cats=Object.keys(S.panels).sort();
  v.innerHTML+=cats.map((cat,k)=>{
    const pans=S.panels[cat];const tot=Object.values(pans).reduce((a,b)=>a+b,0);
    const chips=Object.keys(pans).sort().map(pn=>`<button class="pan-chip" onclick="openPanel('${esc(cat)}','${esc(pn)}')">${pn}<b>${pans[pn]}</b></button>`).join('');
    return `<div class="exome-cat" id="ec${k}"><div class="exome-cat-h" onclick="document.getElementById('ec${k}').classList.toggle('open')">
      <span class="car">▸</span>${cat.replace(/-/g,' ')}<span class="ct">${Object.keys(pans).length} panels · ${tot} traits</span></div>
      <div class="exome-panels">${chips}</div></div>`;
  }).join('');
}
async function openPanel(cat,pan){
  await ensureExome();
  const items=S.exome.filter(i=>{const t=i.taxonomy||{};return t.category===cat&&t.panel===pan});
  const v=document.getElementById('view');
  crumb(['Exome Panels',cat.replace(/-/g,' '),pan]);
  v.innerHTML=`<div class="h-eyebrow" style="color:var(--ev-exome)">${cat.replace(/-/g,' ')}</div>
    <div class="h-title">${pan}</div>
    <div class="fbar"><button class="chip" onclick="route('exome')">← all panels</button>
    <span class="spacer">${items.length} traits</span></div>
    <div class="cards">${items.slice(0,300).map(insCard).join('')}</div>`;
  window.scrollTo(0,0);
}

/* ── Technologies ── */
function renderTech(v){
  crumb(['Technologies']);
  const order=['vitalage','facial_age','exome_clinical','wgs_polygenic','polygenic','pregnancy_nutrition','composite_literature'];
  const techs=order.map(id=>S.val.technologies.find(t=>t.id===id)).filter(Boolean);
  v.innerHTML=`<div class="h-eyebrow">Validation evidence library</div>
    <div class="h-title">Technologies & validation</div>
    <div class="h-sub">The methods behind the catalog, each with cohorts, metrics, patents, publications, and honest caveats. Every insight's evidence tier links here.</div>`+
    techs.map(techCard).join('');
}
function techCard(t){
  const cohorts=(t.cohorts||[]).map(c=>`<li><b>${c.name}</b> (${c.n}) — ${c.role}</li>`).join('');
  const metrics=(t.metrics||[]).map(m=>`<div class="metric"><div class="mv">${m.value}</div><div class="ml">${m.metric}</div></div>`).join('');
  const method=(t.method||[]).map(m=>`<li>${m}</li>`).join('');
  const pat=(t.patents||[]).map(p=>`<li>${p}</li>`).join('');
  const pub=(t.publications||[]).map(p=>`<li>${p}</li>`).join('');
  const cav=(t.honest_caveats||[]).map(c=>`<li>${c}</li>`).join('');
  return `<div class="tcard" id="tech-${t.id}">
    <h3>${t.name}</h3><div class="tt">${t.type}</div>
    <div class="claim">${t.claim_summary}</div>
    ${method?`<div class="tsec"><div class="sh">Method</div><ul>${method}</ul></div>`:''}
    ${metrics?`<div class="tsec"><div class="sh">Validation metrics</div><div class="metric-row">${metrics}</div></div>`:''}
    ${cohorts?`<div class="tsec"><div class="sh">Cohorts</div><ul>${cohorts}</ul></div>`:''}
    ${pat?`<div class="tsec"><div class="sh">Patents</div><ul>${pat}</ul></div>`:''}
    ${pub?`<div class="tsec"><div class="sh">Publications</div><ul>${pub}</ul></div>`:''}
    ${cav?`<div class="tsec caveats"><div class="sh">Honest caveats</div><ul>${cav}</ul></div>`:''}
    <div class="tsec" style="margin-top:6px"><div class="ml" style="font-size:11px;color:var(--ink4)">Source: ${t.source_doc}</div></div>
  </div>`;
}

/* ── Search ── */
async function renderSearch(v){
  const q=S.q.toLowerCase();
  crumb(['Search', `"${S.q}"`]);
  let note='';
  if(!S.exomeLoaded){note=`<div class="inline-load" id="srchload"><span class="spin"></span>Loading exome library to include in search…</div>`}
  const insAll=allInsights();
  const insHits=insAll.filter(i=>i.name.toLowerCase().includes(q)||(i.desc||'').toLowerCase().includes(q)).slice(0,150);
  const bmHits=S.bm.filter(b=>b.biomarker.toLowerCase().includes(q)).slice(0,80);
  v.innerHTML=`<div class="h-title">Results for "${S.q}"</div>
    <div class="h-sub">${insHits.length} insight${insHits.length!=1?'s':''} · ${bmHits.length} biomarker${bmHits.length!=1?'s':''}</div>${note}
    ${bmHits.length?`<div class="fbar"><span class="lbl">Biomarkers</span></div><div class="cards">${bmHits.map(bmCard).join('')}</div>`:''}
    ${insHits.length?`<div class="fbar"><span class="lbl">Insights</span></div><div class="cards">${insHits.map(insCard).join('')}</div>`:''}
    ${!insHits.length&&!bmHits.length&&S.exomeLoaded?`<div class="empty"><div class="big">No matches</div>Try a gene, condition, biomarker, or assessment name.</div>`:''}`;
  if(!S.exomeLoaded){await ensureExome();if(S.q===S.q)renderSearch(v)}
}

/* ───────── drilldown ───────── */
async function openIns(name){
  let i=S.insMap.get(name.toLowerCase());
  if(!i&&!S.exomeLoaded){await ensureExome();i=S.insMap.get(name.toLowerCase())}
  if(!i)return;
  const t=TIERS[i.evidence.tier]||TIERS.composite_literature;
  const tech=i.evidence.technology?S.val.technologies.find(x=>x.id===i.evidence.technology):null;
  const tax=i.taxonomy;
  const progChips=i.programs.map(p=>{const pr=S.progs.find(x=>x.id===p);return `<span class="tag">${pr?pr.name:p}</span>`}).join('');
  const mk=(i.markers||[]).map(m=>`<span class="mk" onclick="openBm('${esc(m)}')">${m}</span>`).join('')||'<span style="color:var(--ink4);font-size:12px">No constituent markers listed</span>';
  const strength='<div class="ev-strength">'+[1,2,3,4,5].map(n=>`<i style="${n<=t.s?'background:'+cssv(t.c):''}"></i>`).join('')+'</div>';

  const techMetric=tech&&tech.metrics&&tech.metrics[0]?`<div class="metric" style="margin-top:10px"><div class="mv">${tech.metrics[0].value}</div><div class="ml">${tech.metrics[0].metric}</div></div>`:'';
  const techMethod=tech&&tech.method?`<ul style="margin-top:8px">${tech.method.slice(0,2).map(m=>`<li>${m}</li>`).join('')}</ul>`:'';
  const caveats=tech&&tech.honest_caveats?`<div class="tsec caveats" style="margin-top:11px"><div class="sh">Caveats</div><ul>${tech.honest_caveats.map(c=>`<li>${c}</li>`).join('')}</ul></div>`:'';
  const patents=tech&&tech.patents&&tech.patents.length?`<dl class="kv" style="margin-top:10px"><dt>Patents</dt><dd>${tech.patents.join('; ')}</dd></dl>`:'';

  document.getElementById('panel').innerHTML=`
    <div class="p-hd">
      <button class="p-close" onclick="closePanel()">×</button>
      <div class="p-name">${i.name}</div>
      <div class="p-hd-meta">${evBadge(i)}${modTag(i)}
        <div class="lens-tog"><button class="on" onclick="setLens('clinical',this)">Clinical</button><button onclick="setLens('defense',this)">Defensibility</button></div>
      </div>
    </div>
    <div class="p-body">
      <div class="blk"><div class="blk-h">What it is</div>
        <dl class="kv">
          <dt>Description</dt><dd>${i.desc||'—'}</dd>
          <dt>Output</dt><dd>${i.unit||'—'}</dd>
          ${i.range?`<dt>Reference</dt><dd>${i.range}</dd>`:''}
          <dt>Programs</dt><dd>${progChips||'—'}</dd>
          ${tax?`<dt>Panel</dt><dd>${tax.panel||'—'} <span style="color:var(--ink4)">· ${(tax.category||'').replace(/-/g,' ')}</span></dd>`:''}
          ${tax&&tax.gender?`<dt>Applies to</dt><dd>${tax.gender==='b'||tax.gender==='m,f'?'All':tax.gender}</dd>`:''}
        </dl>
      </div>

      <!-- CLINICAL LENS -->
      <div class="lens-clinical">
        <div class="blk"><div class="blk-h">How it's computed</div>
          ${i.formula?`<div class="formula">${i.formula}</div>`:'<div style="font-size:12.5px;color:var(--ink3)">No closed-form scoring formula on file — this assessment is produced by the '+(MODS[i.src]?MODS[i.src].lbl:i.src)+' pipeline rather than a weighted index.</div>'}
          <div class="blk-h" style="margin-top:15px">Constituent biomarkers</div><div class="mk-chips">${mk}</div>
        </div>
      </div>

      <!-- DEFENSIBILITY LENS -->
      <div class="lens-defense">
        <div class="blk"><div class="blk-h">Evidence & defensibility</div>
          <div class="ev-head">${strength}<span class="tech-link" style="color:${cssv(t.c)}">${t.lbl}</span></div>
          ${tech?`<div style="font-size:13px;color:var(--ink2);line-height:1.55">${tech.claim_summary}</div>${techMethod}${techMetric}${patents}${i.competitor?`<dl class="kv" style="margin-top:10px"><dt>Competitor</dt><dd>${i.competitor}</dd></dl>`:''}
            <div style="margin-top:13px"><button class="chip on" onclick="route('tech');closePanel();setTimeout(()=>document.getElementById('tech-${tech.id}')?.scrollIntoView({behavior:'smooth'}),100)">View full technology →</button></div>
            ${caveats}`:'<div style="font-size:12.5px;color:var(--ink3)">This assessment is a composite/heuristic score; its evidence rests on the published literature of its constituent biomarkers rather than a dedicated validation study.</div>'}
        </div>
      </div>
    </div>`;
  document.getElementById('panel').setAttribute('data-lens','clinical');
  document.getElementById('ov').classList.add('show');document.body.style.overflow='hidden';
}
function setLens(l,btn){document.getElementById('panel').setAttribute('data-lens',l);
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function closePanel(){document.getElementById('ov').classList.remove('show');document.body.style.overflow=''}

/* biomarker → its insights */
async function openBm(name){
  const b=S.bmMap.get(name.toLowerCase());
  const v=document.getElementById('view');closePanel();
  S.q='';document.getElementById('srch').value='';document.getElementById('srchWrap').classList.remove('has');
  crumb(['Biomarker Query',name]);
  if(!b){v.innerHTML=`<div class="empty"><div class="big">${name}</div>Not found in the biomarker index.</div>`;return}
  const insNames=b.insights||[];
  v.innerHTML=`<div class="h-eyebrow">Biomarker</div><div class="h-title">${b.biomarker}</div>
    <div class="h-sub">Feeds ${b.insight_count} insight${b.insight_count!=1?'s':''} across ${b.programs.length} program${b.programs.length!=1?'s':''}, via ${b.srcs.map(s=>MODS[s]?MODS[s].lbl:s).join(', ')}.</div>
    <div class="fbar"><button class="chip" onclick="route('biomarkers')">← biomarker query</button>
    ${insNames.length<b.insight_count?`<span class="spacer">showing ${insNames.length} of ${b.insight_count}</span>`:''}</div>
    <div class="cards" id="bmins"></div>`;
  // resolve insight objects (lazy-load exome if some missing)
  let objs=insNames.map(n=>S.insMap.get(n.toLowerCase())).filter(Boolean);
  if(objs.length<insNames.length&&!S.exomeLoaded){await ensureExome();objs=insNames.map(n=>S.insMap.get(n.toLowerCase())).filter(Boolean)}
  document.getElementById('bmins').innerHTML=objs.map(insCard).join('')||'<div class="empty">Linked insights are in the exome library.</div>';
  window.scrollTo(0,0);
}

/* ───────── search input ───────── */
let sT;
document.getElementById('srch').addEventListener('input',e=>{
  const val=e.target.value.trim();
  document.getElementById('srchWrap').classList.toggle('has',!!val);
  clearTimeout(sT);sT=setTimeout(()=>{S.q=val;render()},180);
});
function clearSrch(){S.q='';document.getElementById('srch').value='';document.getElementById('srchWrap').classList.remove('has');render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('ov').classList.contains('show'))closePanel();else if(S.q)clearSrch()}});

boot();
</script>
</body>
</html>
